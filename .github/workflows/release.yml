name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o oled-linux-arm64 .
          sha256sum oled-linux-arm64 > oled-linux-arm64.sha256

      - name: Build web UI binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o oled-web-linux-arm64 ./cmd/oledweb
          sha256sum oled-web-linux-arm64 > oled-web-linux-arm64.sha256

      - name: Build .deb package
        env:
          VERSION: ${{ github.ref_name }}
          OUT: ${{ github.workspace }}
        run: |
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh arm64

      - name: Build iNextOS app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf appbundle && mkdir -p appbundle
          install -m 0755 oled-web-linux-arm64 appbundle/oled-web
          install -m 0755 app/install.sh app/uninstall.sh appbundle/
          install -m 0755 app/register.py appbundle/register.py
          install -m 0644 packaging/oled-web.service appbundle/
          install -m 0644 cmd/oledweb/ui/icon.svg appbundle/
          cp "easepi-oled-daemon_${VERSION}_arm64.deb" appbundle/
          tar -C appbundle -czf "easepi-oled-app_${VERSION}_arm64.tar.gz" .
          sha256sum "easepi-oled-app_${VERSION}_arm64.tar.gz" > "easepi-oled-app_${VERSION}_arm64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oled-linux-arm64
          path: |
            oled-linux-arm64
            oled-linux-arm64.sha256
            oled-web-linux-arm64
            oled-web-linux-arm64.sha256
            *.deb
            *.deb.sha256
            easepi-oled-app_*.tar.gz
            easepi-oled-app_*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oled-linux-arm64
            oled-linux-arm64.sha256
            oled-web-linux-arm64
            oled-web-linux-arm64.sha256
            *.deb
            *.deb.sha256
            easepi-oled-app_*.tar.gz
            easepi-oled-app_*.tar.gz.sha256
          generate_release_notes: true
